# EfektPlugin ayarlari (Jestron). Degistirdikten sonra: /efektyenile

# Efektleri kac blok uzaktaki oyuncular gorur (8 - 128).
gorus-mesafesi: 48

# Bir oyuncuya tick basina gonderilebilecek en fazla parcacik (20 - 5000).
# Kalabalik sunucuda dusur; istemcilerin ve agin rahat etmesini saglar.
parcacik-limiti: 600

# Parcacik yogunlugu (0.1 - 2.0). 1 = moddaki varsayilan.
yogunluk: 1.0

# Desenlerin yayilma genisligi (0.5 - 2.5).
yayilim: 1.0

# Ozellikleri tamamen ac / kapat.
auralar: true
elytra-izleri: true

# true: her aura / iz icin ayri izin gerekir
#   efektplugin.aura.<kimlik>   ornek: efektplugin.aura.ates_halkasi
#   efektplugin.elytra.<kimlik> ornek: efektplugin.elytra.anka
#   (hepsi icin efektplugin.aura.* / efektplugin.elytra.*)
# false: efektplugin.use izni olan herkes hepsini kullanir.
her-oge-icin-izin: false

# Efektlerin hic gosterilmeyecegi dunyalar (buyuk/kucuk harf fark etmez).
kapali-dunyalar: []
