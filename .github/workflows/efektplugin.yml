name: EfektPlugin (Paper / Spigot)

# efekt-plugin klasoru degisince: eklenti derlenir; jar + kaynak zip "efektplugin-v<surum>" release'ine konur.
on:
  push:
    branches: [main]
    paths:
      - 'efekt-plugin/**'
      - '.github/workflows/efektplugin.yml'
      - '.github/scripts/yayinla.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: efektplugin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efekt-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Sürümü oku
        id: ver
        run: |
          v=$(grep '^plugin_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          jar=build/libs/EfektPlugin-$v.jar
          test -f "$jar"
          unzip -p "$jar" plugin.yml | grep -q "^version: '$v'"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "jar=efekt-plugin/$jar" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $v  Jar: $jar"

      - name: Release oluştur / güncelle
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.ver.outputs.v }}
          bash .github/scripts/yayinla.sh efekt-plugin "efektplugin-v$v" \
            "EfektPlugin $v — Paper / Spigot 1.20.1 – 1.21.4" \
            "${{ steps.ver.outputs.jar }}" "EfektPlugin-$v" "$v" \
            "**Sunucu eklentisi** · Paper / Purpur / Spigot 1.20.1 – 1.21.4 · Java 17+. Kurulum: jar dosyasını sunucunun \`plugins\` klasörüne koy, sunucuyu yeniden başlat. Modsuz oyuncular da efektleri görür. Komutlar: /efekt, /aura, /elytra. Kaynak kod: \`-kaynak.zip\`." \
            false
