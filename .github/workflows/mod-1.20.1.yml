name: Mod 1.20.1 (Fabric)

# fabric-1.20.1 klasoru degisince: mod derlenir; jar + kaynak zip "mod-1.20.1-v<surum>" release'ine konur.
on:
  push:
    branches: [main, port-1.20.1]
    paths:
      - 'fabric-1.20.1/**'
      - '.github/workflows/mod-1.20.1.yml'
      - '.github/scripts/yayinla.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-1.20.1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-1.20.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Sürümü oku
        id: ver
        run: |
          full=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          short=${full%%+*}
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "jar=fabric-1.20.1/$jar" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $full  Jar: $jar"

      - name: Release oluştur / güncelle
        # port dalinda sadece derlenir; release main'e birlesince
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.ver.outputs.short }}
          bash .github/scripts/yayinla.sh fabric-1.20.1 "mod-1.20.1-v$v" \
            "Efekt Menüsü (JestronPriv) $v — Minecraft 1.20.1 (Fabric)" \
            "${{ steps.ver.outputs.jar }}" "JestronPriv-Mod-$v-mc1.20.1" "$v" \
            "**İstemci modu** · Minecraft 1.20.1 · Fabric Loader 0.16.9+ · Fabric API 0.92+ gerekli · Java 17+. Kurulum: jar dosyasını \`.minecraft/mods\` klasörüne koy (eskisini sil). Kaynak kod: \`-kaynak.zip\`." \
            false
